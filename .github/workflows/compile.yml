name: Compile

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7
        with:
          version: snapshot
      - name: Check out firefox-cookies.el
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DzmingLi/firefox-cookies.el
          ref: fab3f48837c96d3925c024fb2ad9a400ab54df76
          path: .deps/firefox-cookies.el
      - name: Byte-compile package
        run: make check EMACSFLAGS='--batch -Q' ELISP_PATH='.deps/firefox-cookies.el'
